# golangci-lint configuration for TMDB CLI - v1.64.8 compatible
# This configuration is specifically designed for golangci-lint v1.64.8 (last stable V1)

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  go: "1.23.5"

# Output configuration - Updated to use new format
output:
  formats:
    - format: colored-line-number
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

# Linters settings
linters-settings:
  # Error handling - More practical for CLI apps
  errcheck:
    check-type-assertions: true
    check-blank: false # Don't require checking blank assignments
    exclude-functions:
      # Standard library cleanup functions
      - (*os.File).Close
      - (*sql.Rows).Close
      - (*sql.Stmt).Close
      - (*http.Response.Body).Close
      # Logging and output functions where errors are often not critical
      - (io.Writer).Write
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Print
      - fmt.Printf
      - fmt.Println
      # JSON encoding for CLI output
      - (*encoding/json.Encoder).Encode

  # Code complexity
  gocyclo:
    min-complexity: 15

  # Cognitive complexity
  gocognit:
    min-complexity: 20

  # Function length
  funlen:
    lines: 80
    statements: 50

  # Line length
  lll:
    line-length: 120
    tab-width: 4

  # Naming conventions
  stylecheck:
    checks: ["all"]
    initialisms:
      [
        "ACL",
        "API",
        "ASCII",
        "CPU",
        "CSS",
        "DNS",
        "EOF",
        "GUID",
        "HTML",
        "HTTP",
        "HTTPS",
        "ID",
        "IP",
        "JSON",
        "QPS",
        "RAM",
        "RPC",
        "SLA",
        "SMTP",
        "SQL",
        "SSH",
        "TCP",
        "TLS",
        "TTL",
        "UDP",
        "UI",
        "GID",
        "UID",
        "UUID",
        "URI",
        "URL",
        "UTF8",
        "VM",
        "XML",
        "XMPP",
        "XSRF",
        "XSS",
        "TMDB",
        "CLI",
      ]

  # Variable naming
  varnamelen:
    min-name-length: 2
    ignore-names:
      - err
      - i
      - j
      - k
      - v
      - id
      - w
      - r
      - t
      - b
      - q
      - fs
    ignore-decls:
      - c echo.Context
      - t testing.T
      - e error
      - i int
      - j int

  # Import ordering
  goimports:
    local-prefixes: github.com/alnah/tmdb-cli

  # Govet configuration
  govet:
    enable-all: true
    disable:
      - fieldalignment # Can be noisy for CLI apps
      - shadow # Can be overly strict

  # Gosec security rules
  gosec:
    excludes:
      - G204 # Subprocess with variable arguments - common in CLI apps
      - G304 # File path provided as taint input - CLI file operations
    config:
      G301: "0644"
      G302: "0644"
      G306: "0644"

  # Misspell checker
  misspell:
    locale: US
    ignore-words:
      - colour

  # Whitespace
  whitespace:
    multi-if: false
    multi-func: false

  # Goconst settings
  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: true
    match-constant: true
    numbers: true
    min: 3
    max: 3

  # Duplication detection - More practical threshold
  dupl:
    threshold: 250

  # Maintainability index
  maintidx:
    under: 20

  # Error wrapping (Go 1.13+)
  errorlint:
    errorf: true
    asserts: true
    comparison: true

  # Unused code detection - v1 compatible
  unused:
    check-exported: false

  # Performance checks
  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  # Magic numbers detection (replacement for deprecated gomnd)
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-numbers:
      - "0"
      - "1"
      - "2"
      - "3"
      - "10"
      - "100"
      - "1000"
    ignored-functions:
      - "args.Error"
      - "strconv.*"
      - "os.Exit"

# Linters configuration
linters:
  enable:
    # Error handling and reliability
    - errcheck
    - errorlint
    - bodyclose

    # Code quality and complexity
    - gocyclo
    - gocognit
    - funlen
    - gochecknoinits
    - goconst
    - dupl
    - maintidx

    # Style and formatting
    - gofmt
    - gofumpt
    - goimports
    - stylecheck
    - varnamelen
    - whitespace
    - lll

    # Bug detection and static analysis
    - govet
    - staticcheck
    - ineffassign
    - typecheck
    - unused

    # Security
    - gosec

    # Performance
    - prealloc

    # Best practices
    - unconvert
    - misspell
    - nakedret
    - thelper
    - tparallel
    - unparam

    # Magic numbers (replacement for deprecated gomnd)
    - mnd

    # Documentation and comments
    - godot
    - godox

  disable:
    # Too opinionated for CLI apps
    - wsl # Too opinionated about whitespace
    - nlreturn # Too strict about newlines
    - forcetypeassert # CLI apps often need type assertions
    - cyclop # Redundant with gocyclo
    - exhaustive # Can be too strict for CLI apps
    - tagliatelle # Can be too strict for CLI apps

# Issues configuration
issues:
  # Directories and files to exclude
  exclude-dirs:
    - vendor
    - dist
    - bin
    - coverage
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_mock\\.go$"

  # Make issues output unique by line
  uniq-by-line: true

  # Exclude rules for different file types
  exclude-rules:
    # Exclude some linters from running on test files
    - path: _test\.go
      linters:
        - gocyclo
        - funlen
        - dupl
        - gosec
        - goconst
        - maintidx
        - errcheck
        - mnd

    # Exclude some linters from test helper files
    - path: tests/helpers/
      linters:
        - funlen
        - gocyclo
        - dupl
        - mnd

    # Exclude some linters from fixtures
    - path: tests/fixtures/
      linters:
        - funlen
        - goconst
        - dupl
        - varnamelen
        - mnd

    # Exclude line length for long test names
    - linters:
        - lll
      source: "^func Test"

    # Allow long lines in comments for URLs or examples
    - linters:
        - lll
      source: "// http"

    # Exclude godot for TODO comments
    - linters:
        - godot
      source: "// TODO"

    # Exclude certain errors in main.go for CLI patterns
    - path: main\.go
      linters:
        - funlen # Main functions can be longer in CLI apps
        - mnd # Magic numbers are acceptable in CLI main

    # CLI apps often have longer functions in cmd/
    - path: cmd/
      linters:
        - funlen
        - mnd

    # CLI apps often have similar command handling patterns
    - path: internal/commands\.go
      linters:
        - dupl # Command handlers often have similar structure

    # Test files don't need error wrapping or magic number checks
    - path: _test\.go
      linters:
        - errorlint

    # Allow magic numbers in configuration and test files
    - path: (config|test)
      linters:
        - mnd

    # Exclude errcheck for intentionally ignored errors in formatters
    - path: internal/formatters\.go
      linters:
        - errcheck
      text: "Error return value of `fmt\\.(Fprint|Fprintf|Fprintln)` is not checked"

    # Exclude errcheck for defer Close() calls
    - linters:
        - errcheck
      text: "Error return value of.*Close.*is not checked"

    # Exclude errcheck for output functions in CLI context
    - linters:
        - errcheck
      text: "Error return value of.*Write.*is not checked"

  # Exclude default patterns
  exclude-use-default: false
  exclude:
    # CLI specific excludes
    - "should have a package comment" # Not all packages need comments in CLI apps
    - "don't use `init` function" # Sometimes needed for CLI initialization

  # Issue limits
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
