# golangci-lint v2 configuration for TMDB CLI
# ============================================
# This configuration is designed for golangci-lint v2.1.6

version: 2

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  go: "1.23.5"

# Output configuration
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

# Linters configuration - v2 format
linters:
  # Set default linter set (standard/all/none/fast)
  default: standard

  # Enable additional linters
  enable:
    # Error handling and reliability
    - errorlint
    - bodyclose
    - nilerr

    # Code quality and complexity
    - gocyclo
    - gocognit
    - gochecknoinits
    - goconst
    - maintidx

    # Style and formatting
    - revive # Replacement for stylecheck
    - varnamelen
    - whitespace
    - lll
    - godot
    - nlreturn

    # Security
    - gosec

    # Performance
    - prealloc

    # Best practices
    - unconvert
    - misspell
    - nakedret
    - thelper
    - tparallel
    - unparam
    - exhaustive

    # Magic numbers
    - mnd

    # Documentation
    - godox

  # Disable specific linters
  disable:
    # Too opinionated for CLI apps
    - wsl
    - nlreturn
    - forcetypeassert
    - cyclop
    - exhaustive
    - tagliatelle
    - funlen
    - exhaustruct

  # Linter-specific settings
  settings:
    # Error handling
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (*os.File).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (*http.Response.Body).Close
        - (io.Writer).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*encoding/json.Encoder).Encode

    # Code complexity
    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    # Line length
    lll:
      line-length: 120
      tab-width: 4

    # Naming conventions - using revive instead of stylecheck
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
          arguments:
            - [
                "ID",
                "HTTP",
                "HTTPS",
                "URL",
                "URI",
                "JSON",
                "API",
                "UUID",
                "SQL",
                "CSS",
                "DNS",
                "EOF",
                "HTML",
                "TMDB",
                "CLI",
              ]
        - name: exported
        - name: unexported-return
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    # Variable naming
    varnamelen:
      min-name-length: 2
      ignore-names:
        - err
        - i
        - j
        - k
        - v
        - id
        - ok
        - w
        - r
        - t
        - b
        - q
        - fs
      ignore-decls:
        - c echo.Context
        - t testing.T
        - e error
        - i int
        - j int

    # Import ordering
    goimports:
      local-prefixes: github.com/alnah/tmdb-cli

    # Govet configuration
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    # Security rules
    gosec:
      excludes:
        - G204 # Subprocess with variable - common in CLI
        - G304 # File path provided as taint input
      config:
        G301: "0644"
        G302: "0644"
        G306: "0644"

    # Misspell checker
    misspell:
      locale: US
      ignore-words:
        - colour

    # Whitespace
    whitespace:
      multi-if: false
      multi-func: false

    # Goconst settings
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true
      match-constant: true
      numbers: true
      min: 3
      max: 3

    # Maintainability index
    maintidx:
      under: 20

    # Error wrapping
    errorlint:
      errorf: true
      asserts: true
      comparison: true

    # Unused code detection
    unused:
      check-exported: false

    # Performance checks
    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    # Magic numbers detection
    mnd:
      # Disable all checks for test files (configured in issues section)
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
      ignored-files:
        - "_test\\.go$"
        - "tests/"
      ignored-functions:
        - "args.Error"
        - "strconv.*"
        - "os.Exit"
        - "testing.*"

# Issues configuration - v2 format
issues:
  # Paths configuration - v2 format
  paths:
    # Directories and files to exclude
    exclude-dirs:
      - vendor
      - dist
      - bin
      - coverage
    exclude-files:
      - ".*\\.pb\\.go$"
      - ".*_mock\\.go$"

  # Make issues output unique by line
  uniq-by-line: true

  # Exclusion presets - v2 feature
  exclusions:
    # Enable human-readable exclusion presets
    presets:
      - comments # Exclude issues about comments
      - std-error-handling # Standard error handling patterns
      - common-false-positives # Common false positives

    # Custom exclusion rules
    rules:
      # Exclude magic numbers from entire tests directory
      - path: tests
        linters:
          - mnd

      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
          - gosec
          - goconst
          - maintidx
          - errcheck
          - mnd

      # Exclude some linters from test helper files
      - path: tests/helpers
        linters:
          - gocyclo
          - dupl
          - mnd

      # Exclude some linters from fixtures
      - path: tests/fixtures
        linters:
          - goconst
          - dupl
          - varnamelen
          - mnd

      # Exclude line length for long test names
      - linters:
          - lll
        source: "^func Test"

      # Allow long lines in comments for URLs
      - linters:
          - lll
        source: "// http"

      # Exclude godot for TODO comments
      - linters:
          - godot
        source: "// TODO"

      # CLI-specific exclusions
      - path: main\.go
        linters:
          - mnd
          - gochecknoinits
          - gocognit

      # Test files don't need error wrapping
      - path: _test\.go
        linters:
          - errorlint

      # Allow magic numbers in config and test files
      - path: (config|test)
        linters:
          - mnd

      # Formatter-specific exclusions
      - path: internal/formatters.*\.go
        linters:
          - errcheck
        text: "Error return value of `fmt\\.(Fprint|Fprintf|Fprintln)` is not checked"

      # Defer Close() calls
      - linters:
          - errcheck
        text: "Error return value of.*Close.*is not checked"

      # Output functions in CLI context
      - linters:
          - errcheck
        text: "Error return value of.*Write.*is not checked"

      # CLI dispatcher and commands
      - path: internal/cli_(dispatcher|commands)\.go
        linters:
          - gocyclo
          - gocognit

    # Report unused exclusions as warnings
    warn-unused: true

  # Issue limits
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false

# Formatters configuration - v2 feature
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
