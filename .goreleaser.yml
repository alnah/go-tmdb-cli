# GoReleaser configuration for TMDB CLI
# Documentation: https://goreleaser.com
version: 2

# Project metadata
project_name: tmdb-cli

# Environment setup and build preparation
env:
  - CGO_ENABLED=0
  - GO111MODULE=on

before:
  hooks:
    # Tidy dependencies and run tests
    - go mod tidy
    - go test ./...
    # Generate man pages and completions if needed
    # - go generate ./...

# Git configuration
git:
  # What should be used to sort tags when gathering the current and previous
  # tags if there are more than one tag in the same commit
  tag_sort: -version:refname
  # What should be used to specify prerelease suffix while sorting tags when gathering
  # the current and previous tags if there are more than one tag in the same commit
  prerelease_suffix: "-"

# Build configuration
builds:
  - id: tmdb-cli
    # Path to main.go file or main package
    main: .

    # Binary name
    binary: tmdb-cli

    # Build flags
    flags:
      - -trimpath

    # Linker flags
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}

    # Environment variables
    env:
      - CGO_ENABLED=0

    # Target operating systems
    goos:
      - linux
      - darwin
      - windows
      - freebsd

    # Target architectures
    goarch:
      - amd64
      - arm64
      - arm

    # ARM versions (when GOARCH is arm)
    goarm:
      - "6"
      - "7"

    # Ignore certain combinations
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64

# Archive configuration
archives:
  - id: default
    # Archive name template
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    # Archive format per OS
    format_overrides:
      - goos: windows
        format: zip

    # Files to include in archive
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      # Include shell completions if they exist
      # - completions/*

    # Create wrapper script for better user experience
    wrap_in_directory: false

# Universal binaries for macOS (Apple Silicon + Intel)
universal_binaries:
  - id: tmdb-cli-universal
    replace: true
    name_template: tmdb-cli

# Homebrew tap configuration
brews:
  - name: tmdb-cli
    # IDs of the archives to use
    ids:
      - default

    # Git repository to push the formula to
    repository:
      owner: alnah
      name: homebrew-tap
      # Optionally a branch can be provided
      # branch: main

    # Template for the url which is determined by the given Token (github or gitlab)
    url_template: "https://github.com/alnah/tmdb-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    # Git author used to commit to the repository
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

    # The project name and current git tag are used in the format string
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

    # Folder inside the repository to put the formula
    folder: Formula

    # Your app's homepage
    homepage: "https://github.com/alnah/tmdb-cli"

    # Your app's description
    description: "Command-line interface for The Movie Database (TMDB)"

    # SPDX identifier of your app's license
    license: "MIT"

    # Setting this will prevent goreleaser to actually try to commit the updated
    # formula - instead, the formula file will be stored on the dist folder only,
    # leaving the responsibility of publishing it to the user
    skip_upload: false

    # Custom install script for brew
    install: |
      bin.install "tmdb-cli"

    # Custom test script for brew
    test: |
      system "#{bin}/tmdb-cli version"

